[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@3.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

; Habilitar control de señales para que el Serial Monitor no bloquee el inicio de la placa MB
monitor_rts = 0
monitor_dtr = 0

build_flags = 
    -DES_CAM
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[env:esp32devkit]
platform = espressif32@3.5.0
board = esp32devkitv1
framework = arduino
monitor_speed = 115200
build_flags = 
    -DES_DEVKIT