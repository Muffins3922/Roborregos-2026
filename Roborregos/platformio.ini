[env:esp32cam]
platform = espressif32@3.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<cam.cpp>
monitor_rts = 0
monitor_dtr = 0
upload_port = COM4
upload_speed = 115200
monitor_port = COM4
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[env:esp32devkit]
platform = espressif32@3.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<test_servo.cpp>
upload_port = COM3
monitor_port = COM3
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit TCS34725@^1.4.4
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14